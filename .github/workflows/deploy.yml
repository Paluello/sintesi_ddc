name: Build and Deploy Next.js App

on:
  push:
    branches: [ main ]
    paths:
      - 'FRONTEND/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'FRONTEND/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'FRONTEND/package-lock.json'

    - name: Install dependencies
      working-directory: ./FRONTEND
      run: npm ci

    - name: Build Next.js app
      working-directory: ./FRONTEND
      env:
        CI: false
        # add your env vars if needed, e.g. NEXT_PUBLIC_STRAPI_URL
      run: npm run build

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

    - name: Deploy to VPS via rsync
      run: |
        PORT=${SSH_PORT:-22}
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
          ./FRONTEND/.next/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/srv/www/sintesi_ddc/.next
        rsync -avz \
          -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
          ./FRONTEND/public/ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/srv/www/sintesi_ddc/public
        rsync -avz \
          -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
          ./FRONTEND/package.json ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/srv/www/sintesi_ddc/
        rsync -avz \
          -e "ssh -i ~/.ssh/id_rsa -p $PORT" \
          ./FRONTEND/next.config.js ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/srv/www/sintesi_ddc/

    - name: Cleanup SSH key
      if: always()
      run: rm -f ~/.ssh/id_rsa
