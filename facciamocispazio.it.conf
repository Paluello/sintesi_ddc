upstream nextjs_backend {
    server 127.0.0.1:3000;
}

# Redirect www to root domain
server {
    listen 80;
    listen [::]:80;
    server_name www.facciamocispazio.it;
    
    return 301 http://facciamocispazio.it$request_uri;
}

# Main server block for Next.js
server { 
    listen 80;
    listen [::]:80;
    server_name facciamocispazio.it;
    
    root /srv/www/sintesi_ddc;

    # Serve Next.js static files with caching
    location /_next/static/ {
        alias /srv/www/sintesi_ddc/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Serve public assets
    location /images/ {
        alias /srv/www/sintesi_ddc/public/images/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /animations/ {
        alias /srv/www/sintesi_ddc/public/animations/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /svg_artefatti/ {
        alias /srv/www/sintesi_ddc/public/svg_artefatti/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy all other requests to Next.js server
    location / {
        proxy_pass http://nextjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}